<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多维表图片导出 Excel</title>
  <!-- 字体：Inter 渐进增强（英文/数字更现代），被墙自动降级系统字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=20260819d" />
  <!-- ExcelJS 本地优先，失败再走 CDN（由 app.js 兜底） -->
  <script src="./vendor/exceljs.min.js"></script>
  <!-- JSZip 本地优先，失败再走 CDN（由 app.js 兜底） -->
  <script src="./vendor/jszip.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4.5" fill="#3370ff" opacity="0.14"/>
          <rect x="3" y="3" width="18" height="18" rx="4.5" stroke="#3370ff" stroke-width="1.6"/>
          <circle cx="8.8" cy="8.8" r="1.7" fill="#3370ff"/>
          <path d="M5.2 17.2 9.4 13 12.2 15.8 15.6 12.4 18.8 15.6" stroke="#3370ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
        <div class="brand-text">
          <h1>多维表图片导出 Excel</h1>
          <p class="subtitle">飞书每行图片一键导出带图表格</p>
        </div>
      </div>
      <button id="btnSettings" class="icon-btn" title="更多设置" aria-label="更多设置">⚙</button>
    </header>

    <div id="status" class="status status-idle">
      <span class="dot"></span><span id="statusText">正在初始化…</span>
    </div>

    <div id="progressBox" class="progress-box hidden">
      <div class="progress-meta">
        <span id="progressPct">0%</span>
        <span id="progressCount"></span>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </div>

    <section class="card">
      <div class="card-head">
        <span class="card-title">数据表</span>
        <span id="count" class="tag"></span>
      </div>
      <select id="tableSelect" class="select hidden"></select>
      <p class="muted xs">选择要导出的数据表（切换后请点下方「加载数据」）。</p>
    </section>

    <section class="card card-collapsible">
      <div class="card-head clickable" id="fieldToggle" role="button" tabindex="0" aria-expanded="false">
        <span class="card-title">导出字段</span>
        <span class="field-summary" id="fieldSummary">未选择</span>
        <span class="chev collapsed"></span>
      </div>
      <div class="field-dropdown collapsed" id="fieldDropdown">
        <div class="field-toolbar">
          <button type="button" class="link" id="btnSelectAll">全选</button>
          <button type="button" class="link" id="btnClearAll">清空</button>
          <button type="button" class="link" id="btnSelectImg">仅图片</button>
        </div>
        <p class="muted xs">勾选要导出的列 · 图片列自动嵌入单元格</p>
        <div id="fieldList" class="field-list">
          <div class="placeholder">请先在飞书中打开本插件并选择数据表</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><span class="card-title">图片设置</span></div>
      <div class="form-row inline-row">
        <label for="imgQuality">图片质量</label>
        <select id="imgQuality" class="mini-select">
          <option value="thumb">缩略图（最快·推荐）</option>
          <option value="orig">高清原图（直连飞书）</option>
        </select>
      </div>
      <div class="form-row inline-row">
        <label for="imgMode">图片嵌入方式</label>
        <select id="imgMode" class="mini-select">
          <option value="float">贴入单元格（推荐·全版本可见）</option>
          <option value="image">内嵌 IMAGE 公式（Excel 365/新版 WPS 可复制）</option>
        </select>
      </div>
      <div class="form-row inline-row">
        <label for="imgWidth">图片显示宽度（像素）</label>
        <input id="imgWidth" type="number" min="40" max="400" step="10" value="50" class="mini-input" />
      </div>
      <p class="muted xs">质量：缩略图由飞书直接返回、不逐个联网，最快最稳；高清原图直连飞书附件（无需代理），但受 CORS 限制可能回退缩略图。嵌入：贴入图所有版本可见；内嵌额外写 IMAGE 公式，Excel 365/新版 WPS 下复制单元格可带走图片。</p>
    </section>

    <section class="actions">
      <button id="btnLoad" class="btn btn-primary block" disabled><span class="step">1</span>加载数据</button>
      <button id="btnExport" class="btn btn-primary block" disabled><span class="step">2</span>导出 Excel</button>
      <button id="btnExportZip" class="btn btn-soft block" disabled><span class="step">3</span>导出图片 ZIP</button>
      <p class="muted xs center">先「加载数据」再「导出」；未加载时导出按钮不可用。</p>
    </section>

    <section class="card log-card">
      <div class="card-head clickable" id="logToggle">
        <span class="card-title">运行日志</span>
        <span class="chev">›</span>
      </div>
      <div id="logPanel" class="log-panel collapsed">
        <div id="log" class="log"></div>
      </div>
    </section>
  </main>

  <!-- 设置弹窗（仅放高级项） -->
  <div class="modal-mask" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span>更多设置</span>
        <button class="icon-btn" id="btnCloseSettings" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row inline-row">
          <label for="concurrency">并发下载数</label>
          <input id="concurrency" type="number" min="1" max="30" step="1" value="10" class="mini-input" />
        </div>
        <div class="form-row inline-row">
          <label for="ignoreView">导出全部记录（忽略筛选/排序）</label>
          <input id="ignoreView" type="checkbox" />
        </div>
        <div class="form-row">
          <label for="markField">导出后标记</label>
          <select id="markField"><option value="">不标记</option></select>
        </div>
        <div class="form-row">
          <label for="namingField">ZIP 命名列</label>
          <select id="namingField"></select>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js?v=20260819d"></script>
</body>
</html>
