<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多维表图片导出 Excel</title>
  <link rel="stylesheet" href="./styles.css" />
  <!-- ExcelJS 本地优先，失败再走 CDN（由 app.js 兜底） -->
  <script src="./vendor/exceljs.min.js"></script>
  <!-- JSZip 本地优先，失败再走 CDN（由 app.js 兜底） -->
  <script src="./vendor/jszip.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>多维表图片导出 Excel</h1>
      <p class="subtitle">把飞书多维表每一行的图片字段导出为带图的 Excel，纯前端即开即用</p>
    </header>

    <section class="card status-card">
      <div id="status" class="status status-idle">
        <span class="dot"></span><span id="statusText">正在初始化…</span>
      </div>
      <p id="envHint" class="env-hint hidden">
        提示：本插件需在飞书多维表里作为「自定义插件」打开。请在飞书开发者后台创建应用 → 添加「多维表格」能力 → 填写本页面网址，并于多维表内启用插件。
      </p>
    </section>

    <section class="card">
      <div class="section-title">数据表</div>
      <div class="table-bar">
        <select id="tableSelect" class="hidden"></select>
        <button id="btnLoad" class="btn btn-secondary" disabled>加载数据</button>
        <span id="count" class="count"></span>
      </div>
    </section>

    <section class="card">
      <div class="section-title">导出字段</div>
      <p class="hint">勾选需要导出的字段。图片字段会嵌入单元格，其余字段导出为文字。</p>
      <div class="field-toolbar">
        <button type="button" class="btn-link" id="btnSelectAll">全选</button>
        <button type="button" class="btn-link" id="btnClearAll">清空</button>
        <button type="button" class="btn-link" id="btnSelectImg">仅图片</button>
      </div>
      <div id="fieldList" class="field-list">
        <div class="placeholder">尚未加载字段，请在飞书多维表中打开本插件并选择数据表。</div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">导出设置</div>
      <div class="options-grid">
        <label class="opt">
          <span>图片显示宽度（像素）</span>
          <input id="imgWidth" type="number" min="60" max="400" step="10" value="150" />
        </label>
        <label class="opt">
          <span>并发下载数</span>
          <input id="concurrency" type="number" min="1" max="20" step="1" value="6" />
        </label>
        <label class="opt opt-check">
          <input id="onlyCurrentView" type="checkbox" />
          <span>仅导出当前视图</span>
        </label>
        <label class="opt">
          <span>导出后标记「已导出」</span>
          <select id="markField"><option value="">不标记</option></select>
        </label>
        <label class="opt">
          <span>ZIP 图片命名列</span>
          <select id="namingField"></select>
        </label>
        <label class="opt opt-wide">
          <span>原图代理（Cloudflare Worker URL，留空则用飞书原图直取）</span>
          <input id="workerUrl" type="text" placeholder="https://xxx.workers.dev" value="https://feishu-bitable-image-excel.yunjueyin-github-io-pags.workers.dev" />
        </label>
      </div>
    </section>

    <section class="card actions">
      <button id="btnExport" class="btn btn-primary" disabled>导出 Excel</button>
      <button id="btnExportZip" class="btn btn-secondary" disabled>导出图片 ZIP</button>
      <button id="btnTestProxy" class="btn btn-ghost">测试代理</button>
    </section>

    <section class="card">
      <div class="section-title">进度</div>
      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
