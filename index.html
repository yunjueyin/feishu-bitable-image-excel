<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多维表图片导出 Excel</title>
  <link rel="stylesheet" href="./styles.css" />
  <!-- ExcelJS 本地优先，失败再走 CDN（由 app.js 兜底） -->
  <script src="./vendor/exceljs.min.js"></script>
  <!-- JSZip 本地优先，失败再走 CDN（由 app.js 兜底） -->
  <script src="./vendor/jszip.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">🖼️</div>
        <div class="brand-text">
          <h1>多维表图片导出 Excel</h1>
          <p class="subtitle">飞书每行图片一键导出带图表格</p>
        </div>
      </div>
      <button id="btnSettings" class="icon-btn" title="更多设置" aria-label="更多设置">⚙</button>
    </header>

    <div id="status" class="status status-idle">
      <span class="dot"></span><span id="statusText">正在初始化…</span>
    </div>

    <section class="card">
      <div class="card-head">
        <span class="card-title">数据表</span>
        <span id="count" class="tag"></span>
      </div>
      <select id="tableSelect" class="select hidden"></select>
      <p class="muted xs">选择要导出的数据表（切换后请点下方「加载数据」）。</p>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="card-title">导出字段</span>
        <div class="field-toolbar">
          <button type="button" class="link" id="btnSelectAll">全选</button>
          <button type="button" class="link" id="btnClearAll">清空</button>
          <button type="button" class="link" id="btnSelectImg">仅图片</button>
        </div>
      </div>
      <p class="muted xs">勾选要导出的列 · 图片列自动嵌入单元格</p>
      <div id="fieldList" class="field-list">
        <div class="placeholder">请先在飞书中打开本插件并选择数据表</div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><span class="card-title">图片设置</span></div>
      <div class="form-row inline-row">
        <label for="imgMode">图片嵌入方式</label>
        <select id="imgMode" class="mini-select">
          <option value="float">贴入单元格（推荐·全版本可见）</option>
          <option value="image">内嵌 IMAGE 公式（Excel 365/新版 WPS 可复制）</option>
        </select>
      </div>
      <div class="form-row inline-row">
        <label for="imgWidth">图片显示宽度（像素）</label>
        <input id="imgWidth" type="number" min="40" max="400" step="10" value="50" class="mini-input" />
      </div>
      <p class="muted xs">贴入：图片锚定在单元格内，所有 Excel/WPS 可见；内嵌：额外写 IMAGE 公式，Excel 365 或新版 WPS 下复制单元格可带走图片（旧版自动忽略、仍显示贴入图，不会空白）。</p>
    </section>

    <section class="actions">
      <button id="btnLoad" class="btn btn-primary block" disabled>① 加载数据</button>
      <button id="btnExport" class="btn btn-primary block" disabled>② 导出 Excel</button>
      <button id="btnExportZip" class="btn btn-soft block" disabled>③ 导出图片 ZIP</button>
      <p class="muted xs center">先「加载数据」再「导出」；未加载时导出按钮不可用。</p>
    </section>

    <section class="card log-card">
      <div class="card-head clickable" id="logToggle">
        <span class="card-title">运行日志</span>
        <span class="chev">›</span>
      </div>
      <div id="logPanel" class="log-panel collapsed">
        <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
        <div id="log" class="log"></div>
      </div>
    </section>
  </main>

  <!-- 设置弹窗（仅放高级项） -->
  <div class="modal-mask" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span>更多设置</span>
        <button class="icon-btn" id="btnCloseSettings" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row inline-row">
          <label for="concurrency">并发下载数</label>
          <input id="concurrency" type="number" min="1" max="20" step="1" value="6" class="mini-input" />
        </div>
        <div class="form-row inline-row">
          <label for="onlyCurrentView">仅导出当前视图</label>
          <input id="onlyCurrentView" type="checkbox" />
        </div>
        <div class="form-row">
          <label for="markField">导出后标记</label>
          <select id="markField"><option value="">不标记</option></select>
        </div>
        <div class="form-row">
          <label for="namingField">ZIP 命名列</label>
          <select id="namingField"></select>
        </div>
        <div class="form-row col">
          <label for="workerUrl">原图代理（Cloudflare Worker）</label>
          <input id="workerUrl" type="text" placeholder="留空则用飞书缩略图（推荐）" />
          <p class="muted xs">填了才尝试取高清原图；留空直接走飞书缩略图，无需联网代理。</p>
          <button id="btnTestProxy" class="btn btn-soft sm">测试代理连通性</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
